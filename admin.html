<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Fajar Academy | ERP Admin</title>
<style>
:root{--green:#087443;--green2:#0b8d55;--deep:#063d2a;--bg:#f3f7f5;--ink:#17231e;--muted:#6b7b73;--line:#e2ebe6;--white:#fff;--red:#c43d3d;--amber:#b7791f;--shadow:0 12px 32px rgba(15,55,37,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eaf5ef,#f7faf8)}.login-card{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:var(--shadow)}.brand-mark{width:52px;height:52px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:21px;margin-bottom:18px}.login-card h1{font-size:24px;margin:0 0 4px}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:11px 12px;border:1px solid #d8e4dd;border-radius:10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--green2);box-shadow:0 0 0 3px #0b8d5518}.btn{padding:10px 15px;border-radius:10px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--deep)}.btn-soft{background:#e8f4ed;color:var(--green)}.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-danger{background:#fff0f0;color:var(--red)}.btn-warn{background:#fff5df;color:#98630d}.btn:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:255px;background:#073d2b;color:#e9fff2;padding:22px 16px;display:flex;flex-direction:column;z-index:10}.side-brand{display:flex;gap:12px;align-items:center;padding:4px 9px 25px;border-bottom:1px solid #ffffff1c}.side-brand .brand-mark{width:42px;height:42px;margin:0;background:#e9fff2;color:var(--deep);border-radius:13px}.side-brand strong{display:block;font-size:14px;line-height:1.25}.side-brand small{color:#a8c8b7}.nav-label{font-size:10px;letter-spacing:1.5px;color:#8fb5a0;font-weight:800;padding:23px 12px 8px}.nav{display:grid;gap:5px}.nav button{width:100%;text-align:left;padding:11px 13px;border-radius:10px;color:#d4e9dc;background:transparent;font-weight:650;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav .ico{width:19px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid #ffffff1c;padding-top:14px}.admin-chip{padding:10px 12px;color:#b8d4c3;font-size:12px}.main{margin-left:255px;min-height:100vh}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.topbar h2{font-size:19px;margin:0}.top-right{display:flex;align-items:center;gap:12px}.avatar{width:36px;height:36px;border-radius:50%;background:#e3f2e9;color:var(--green);display:grid;place-items:center;font-weight:900}.content{padding:28px 30px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.page-head h1{font-size:25px;margin:0 0 3px}.page-head p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 15px #173d2910}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}.stat strong{display:block;font-size:29px;margin-top:8px;letter-spacing:-1px}.stat-icon{width:36px;height:36px;border-radius:11px;background:#eaf5ef;display:grid;place-items:center;color:var(--green);font-size:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 15px #173d2908;overflow:hidden}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h3{margin:0;font-size:16px}.panel-body{padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.toolbar input{max-width:330px;flex:1;min-width:180px}.toolbar select{width:auto;min-width:140px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.record{border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;gap:14px;min-width:0;background:#fff}.record:hover{box-shadow:0 8px 22px #143d2910;border-color:#cbded2}.photo{width:68px;height:68px;flex:0 0 68px;border-radius:13px;object-fit:cover;background:#edf3ef}.record-main{min-width:0;flex:1}.record-title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.record-title h3{margin:0;font-size:15px;overflow-wrap:anywhere}.subline{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.record-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{font-size:11px;font-weight:800;border-radius:30px;padding:4px 9px;background:#edf3ef;color:#506258}.pill.green{background:#e5f6eb;color:#087443}.pill.amber{background:#fff3d9;color:#946200}.pill.red{background:#ffeded;color:#b32d2d}.record-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.record-actions .btn{padding:7px 10px;font-size:12px}.empty{padding:42px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fbf9;color:#617269;font-size:11px;text-transform:uppercase;letter-spacing:.5px}td{vertical-align:middle}.table-actions{display:flex;gap:6px}.pager{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:var(--muted);font-size:12px}.pager button{padding:7px 11px;border:1px solid var(--line);background:#fff;border-radius:8px}.notice{position:fixed;top:16px;left:50%;transform:translate(-50%,-140%);z-index:50;background:#0a7546;color:white;padding:13px 20px;border-radius:12px;box-shadow:var(--shadow);font-weight:750;transition:transform .25s;max-width:calc(100% - 30px)}.notice.show{transform:translate(-50%,0)}.notice.error{background:#b83232}.modal-back{position:fixed;inset:0;background:#071c13a6;z-index:30;display:grid;place-items:center;padding:18px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 20px 60px #001b0d55}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 21px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}.modal-head h3{margin:0;font-size:18px}.modal-body{padding:20px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:15px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}.close{background:#f0f4f1;border-radius:9px;width:34px;height:34px;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{padding:11px;background:#f7faf8;border-radius:10px;min-width:0}.detail small{display:block;color:var(--muted);font-size:11px;font-weight:750;text-transform:uppercase}.detail b{display:block;margin-top:3px;overflow-wrap:anywhere}.receipt{max-width:100%;max-height:360px;object-fit:contain;border-radius:12px;border:1px solid var(--line)}.mobile-menu{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{width:250px;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{height:64px;padding:0 16px}.mobile-menu{display:inline-flex}.content{padding:20px 14px}.page-head{align-items:flex-start}.page-head h1{font-size:22px}.stats{gap:10px}.stat{padding:13px}.stat strong{font-size:24px}.stat-top{font-size:11px}.stat-icon{width:30px;height:30px}.record{padding:12px;gap:10px}.photo{width:54px;height:54px;flex-basis:54px}.record-title{display:block}.record-title .pill{display:inline-block;margin-top:5px}.toolbar input{max-width:none;flex-basis:100%}.toolbar select{flex:1}.form-grid,.detail-grid{grid-template-columns:1fr}.top-right .admin-name{display:none}}
</style>
</head>
<body>
<div id="notice" class="notice"></div>
<section id="loginView" class="login-wrap">
 <div class="login-card">
  <div class="brand-mark">AF</div>
  <h1>Al-Fajar Academy</h1><div class="muted">ERP Administration Portal</div>
  <form id="loginForm">
   <div class="field"><label>Admin Username</label><input id="loginUser" autocomplete="username" required placeholder="Enter admin username"></div>
   <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required placeholder="Enter password"></div>
   <button class="btn btn-primary" style="width:100%;margin-top:8px" id="loginBtn">Sign in securely</button>
  </form>
  <p class="muted" style="font-size:12px;margin:18px 0 0">Authorized academy administrators only.</p>
 </div>
</section>
<div id="appView" class="app hidden">
 <aside class="sidebar" id="sidebar">
  <div class="side-brand"><div class="brand-mark">AF</div><div><strong>AL-FAJAR<br>ISLAMIC ACADEMY</strong><small>Management ERP</small></div></div>
  <div class="nav-label">WORKSPACE</div>
  <nav class="nav">
   <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
   <button data-page="admissions"><span class="ico">♙</span>Admissions</button>
   <button data-page="payments"><span class="ico">▤</span>Payments</button>
   <button data-page="results"><span class="ico">▧</span>Results</button>
   <button data-page="classes"><span class="ico">▣</span>Classes</button>
   <button data-page="portal"><span class="ico">◎</span>Portal Management</button>
  </nav>
  <div class="nav-label">ADMINISTRATION</div>
  <nav class="nav"><button data-page="users"><span class="ico">♧</span>Users</button></nav>
  <div class="side-bottom"><div class="admin-chip">Signed in as <b id="sideUser">Admin</b></div><button class="nav" style="width:100%;text-align:left;padding:11px 13px;border-radius:10px;color:#d4e9dc;background:transparent;font-weight:650" id="logoutBtn">↪ &nbsp; Sign out</button></div>
 </aside>
 <main class="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn btn-line mobile-menu" id="menuBtn">☰</button><h2 id="topTitle">Dashboard</h2></div><div class="top-right"><span class="admin-name muted" id="topUser">Administrator</span><div class="avatar">A</div></div></header>
  <div class="content" id="pageContent"></div>
 </main>
</div>
<div id="modalBack" class="modal-back hidden"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Details</h3><button class="close" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwha4Gml10ICxGcqIsn2Cdp2DEOMKxA8jAWAr78UQyXuyA7eG9v-Qx81f43vFuNnl4/exec';
const state={token:'',username:'',page:'dashboard',stats:{},admissions:[],results:[],resultHeaders:[],users:[],query:'',filter:'all',pageNo:1,pageSize:8};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c='PKR')=>`${c} ${Number(v||0).toLocaleString()}`;
function notify(msg,error=false){const n=$('#notice');n.textContent=msg;n.classList.toggle('error',error);n.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),5000)}
async function api(action,data={}){let res;try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});}catch(e){throw new Error('Could not connect to the Apps Script backend. Check deployment and internet connection.')}let raw=await res.text();let j;try{j=JSON.parse(raw)}catch(e){throw new Error('Backend response was not JSON. Confirm the Apps Script Web App URL and deployment access.')}if(!j.ok)throw new Error(j.error||'Request failed.');return j}
function withToken(extra={}){return {adminToken:state.token,...extra}}
function openModal(title,body,buttons=[]){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=buttons.map((b,i)=>`<button class="btn ${b.cls||'btn-line'}" data-modal-action="${i}">${esc(b.label)}</button>`).join('');$('#modalBack').classList.remove('hidden');$('#modalFoot').querySelectorAll('button').forEach((el,i)=>el.onclick=()=>buttons[i].run())}
function closeModal(){$('#modalBack').classList.add('hidden')}
$('#modalClose').onclick=closeModal;$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('#loginBtn');b.disabled=true;b.textContent='Signing in…';try{const r=await api('erpAdminLogin',{username:$('#loginUser').value.trim(),password:$('#loginPass').value});state.token=r.adminToken;state.username=$('#loginUser').value.trim();$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#sideUser').textContent=state.username;$('#topUser').textContent=state.username;await navigate('dashboard');notify('Welcome to Al-Fajar Academy ERP.')}catch(err){notify(err.message,true)}finally{b.disabled=false;b.textContent='Sign in securely'}});
async function logout(){try{await api('erpAdminLogout',{adminToken:state.token})}catch(e){}state.token='';$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#loginPass').value='';}
$('#logoutBtn').onclick=logout;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
async function navigate(page){state.page=page;state.query='';state.filter='all';state.pageNo=1;document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');const titles={dashboard:'Dashboard',admissions:'Admissions',payments:'Payments',results:'Results',classes:'Classes','portal':'Portal Management',users:'Users'};$('#topTitle').textContent=titles[page];$('#pageContent').innerHTML='<div class="empty">Loading records…</div>';try{if(page==='dashboard')await renderDashboard();else if(['admissions','payments','classes','portal'].includes(page)){await loadAdmissions();renderAdmissionsPage(page)}else if(page==='results'){await loadResults();renderResults()}else if(page==='users'){await loadUsers();renderUsers()}}catch(e){$('#pageContent').innerHTML=`<div class="panel empty"><b>Unable to load this section</b>${esc(e.message)}<p><button class="btn btn-primary" onclick="navigate('${page}')">Try again</button></p></div>`}}
async function renderDashboard(){const r=await api('erpDashboard',withToken());state.stats=r.stats;const s=r.stats;$('#pageContent').innerHTML=`<div class="page-head"><div><h1>Academy Overview</h1><p>Manage admissions, payments, academic records and student access.</p></div><button class="btn btn-primary" onclick="navigate('admissions')">＋ View Admissions</button></div><div class="stats">${[['Admissions',s.admissions,'♙'],['Payments Submitted',s.payments,'▤'],['Verified Students',s.verified,'✓'],['Pending Review',s.pending,'◷'],['Published / Stored Results',s.results,'▧'],['Portal Users',s.users,'◎'],['Classes',s.classes,'▣'],['Total Received',money(s.totalPaid),'₨']].map(x=>`<div class="stat"><div class="stat-top"><span>${x[0]}</span><span class="stat-icon">${x[2]}</span></div><strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><div class="panel-head"><h3>Quick actions</h3></div><div class="panel-body" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-soft" onclick="navigate('admissions')">Review Admissions</button><button class="btn btn-soft" onclick="navigate('payments')">Manage Payments</button><button class="btn btn-soft" onclick="navigate('results')">Manage Results</button><button class="btn btn-soft" onclick="navigate('classes')">Manage Classes</button></div></div>`}
async function loadAdmissions(){const r=await api('erpListAdmissions',withToken());state.admissions=r.applications||[]}
async function loadResults(){const r=await api('erpListResults',withToken());state.results=r.results||[];state.resultHeaders=r.headers||[]}
async function loadUsers(){const r=await api('erpListUsers',withToken());state.users=r.users||[]}
function statusPill(s){s=String(s||'Pending');let cls=/verified|active|published/i.test(s)?'green':/reject|fail|suspend/i.test(s)?'red':'amber';return `<span class="pill ${cls}">${esc(s)}</span>`}
function filterRecords(items,mode){let q=state.query.toLowerCase();return items.filter(a=>{let match=!q||[a.studentName,a.parentName,a.email,a.applicationId,a.rollNo,a.portalUsername,a.course,a.trxId].some(v=>String(v||'').toLowerCase().includes(q));let st=String(a.paymentStatus||'').toLowerCase();let f=state.filter==='all'||(state.filter==='pending'&&!st.includes('verified')&&!st.includes('reject'))||(state.filter==='verified'&&st.includes('verified'))||(state.filter==='rejected'&&st.includes('reject'))||(state.filter==='paid'&&Number(a.amountPaid)>=Number(a.amountDue)&&Number(a.amountDue)>0)||(state.filter==='unpaid'&&Number(a.amountPaid)<Number(a.amountDue));return match&&f})}
function toolbar(filter=true){return `<div class="toolbar"><input id="searchBox" placeholder="Search name, email, roll number or application ID…" value="${esc(state.query)}"><select id="filterBox"><option value="all">All records</option>${filter?'<option value="pending">Pending</option><option value="verified">Verified</option><option value="rejected">Rejected</option><option value="paid">Fully paid</option><option value="unpaid">Unpaid / Partial</option>':''}</select><select id="sortBox"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Name A–Z</option></select></div>`}
function attachToolbar(render){$('#searchBox').oninput=e=>{state.query=e.target.value;state.pageNo=1;render()};$('#filterBox').value=state.filter;$('#filterBox').onchange=e=>{state.filter=e.target.value;state.pageNo=1;render()};$('#sortBox').onchange=e=>{state.sort=e.target.value;state.pageNo=1;render()}}
function paged(items){let arr=[...items];if(state.sort==='old')arr.reverse();if(state.sort==='name')arr.sort((a,b)=>String(a.studentName||'').localeCompare(String(b.studentName||'')));let pages=Math.max(1,Math.ceil(arr.length/state.pageSize));state.pageNo=Math.min(state.pageNo,pages);return {items:arr.slice((state.pageNo-1)*state.pageSize,state.pageNo*state.pageSize),total:arr.length,pages}}
function pager(p){return `<div class="pager"><span>Showing ${p.total?((state.pageNo-1)*state.pageSize+1):0}–${Math.min(state.pageNo*state.pageSize,p.total)} of ${p.total}</span><div style="display:flex;gap:7px"><button ${state.pageNo<=1?'disabled':''} id="prevPage">Previous</button><button ${state.pageNo>=p.pages?'disabled':''} id="nextPage">Next</button></div></div>`}
function bindPager(p,render){$('#prevPage')?.addEventListener('click',()=>{state.pageNo--;render()});$('#nextPage')?.addEventListener('click',()=>{state.pageNo++;render()})}
function renderAdmissionsPage(page){const title={admissions:'Admissions',payments:'Payments',classes:'Class Management',portal:'Portal Management'}[page];const desc={admissions:'Review applications, verify records and manage student details.',payments:'Review receipts, record payments and verify fully paid admissions.',classes:'Manage student class placement, teacher and online class links.',portal:'Manage student portal usernames, roll numbers and account status.'}[page];$('#pageContent').innerHTML=`<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><button class="btn btn-line" onclick="refreshCurrent()">↻ Refresh</button></div><div id="recordsArea"></div>`;drawAdmissionCards(page)}
function drawAdmissionCards(page){let items=filterRecords(state.admissions,page);if(page==='payments')items=items.filter(a=>a.receiptImageUrl||a.amountDue||a.amountPaid||a.paymentStatus);if(page==='classes')items=items.filter(a=>a.className||a.classTiming||a.classDays||a.teacherName||a.zoomJoinLink||a.rollNo);if(page==='portal')items=items.filter(a=>a.portalUsername||a.paymentStatus==='Verified');let p=paged(items);$('#recordsArea').innerHTML=toolbar()+`<div class="cards">${p.items.map(a=>recordCard(a,page)).join('')||'<div class="panel empty" style="grid-column:1/-1"><b>No records found</b>Try changing your search or filter.</div>'}</div>${pager(p)}`;attachToolbar(()=>drawAdmissionCards(page));bindPager(p,()=>drawAdmissionCards(page))}
function recordCard(a,page){let photo=a.studentPhotoUrl?`<img class="photo" src="${esc(a.studentPhotoUrl)}" onerror="this.style.visibility='hidden'">`:`<div class="photo" style="display:grid;place-items:center;color:#7b9586;font-size:24px">♙</div>`;let status=a.paymentStatus||'Pending';let payFull=Number(a.amountDue)>0&&Number(a.amountPaid)>=Number(a.amountDue);let actions=page==='payments'?`<button class="btn btn-soft" onclick="viewAdmission('${esc(a.applicationId)}')">View receipt</button><button class="btn btn-line" onclick="editPayment('${esc(a.applicationId)}')">Edit payment</button><button class="btn btn-primary" ${payFull?'':'disabled'} onclick="verifyPayment('${esc(a.applicationId)}')">Verify</button>`:page==='classes'?`<button class="btn btn-soft" onclick="editClass('${esc(a.applicationId)}')">Edit class</button>`:page==='portal'?`<button class="btn btn-soft" onclick="viewAdmission('${esc(a.applicationId)}')">View</button><button class="btn btn-line" onclick="editClass('${esc(a.applicationId)}')">Edit access</button>`:`<button class="btn btn-soft" onclick="viewAdmission('${esc(a.applicationId)}')">View</button><button class="btn btn-line" onclick="editAdmission('${esc(a.applicationId)}')">Edit</button>${payFull&&!/verified/i.test(status)?`<button class="btn btn-primary" onclick="verifyPayment('${esc(a.applicationId)}')">Verify & Create Login</button>`:''}`;return `<article class="record">${photo}<div class="record-main"><div class="record-title"><div><h3>${esc(a.studentName||'Unnamed Student')}</h3><div class="subline">${esc(a.applicationId)} · ${esc(a.course||'Course not set')}</div></div>${statusPill(status)}</div><div class="record-meta"><span class="pill">Roll: ${esc(a.rollNo||a.portalUsername||'Not assigned')}</span>${page==='payments'?`<span class="pill ${payFull?'green':'amber'}">${money(a.amountPaid,a.paymentCurrency)} / ${money(a.amountDue,a.paymentCurrency)}</span>`:`<span class="pill">${esc(a.email||'No email')}</span>`}</div><div class="subline">${esc(a.parentName||'')} ${a.classTiming?'· '+esc(a.classTiming):''}</div><div class="record-actions">${actions}</div></div></article>`}
function findAdmission(id){return state.admissions.find(a=>a.applicationId===id)}
function viewAdmission(id){let a=findAdmission(id);if(!a)return;let pairs=[['Application ID',a.applicationId],['Student',a.studentName],['Parent / Guardian',a.parentName],['Age / Gender',`${a.age||''} / ${a.gender||''}`],['Email',a.email],['WhatsApp',a.whatsapp],['Country',a.country],['Course',a.course],['Previous Experience',a.experience],['Preferred Timing',a.preferredTiming],['Payment Status',a.paymentStatus],['Transaction ID',a.trxId],['Account Holder',a.accountHolderName],['Amount Due',money(a.amountDue,a.paymentCurrency)],['Amount Paid',money(a.amountPaid,a.paymentCurrency)],['Roll Number',a.rollNo],['Portal Username',a.portalUsername],['Class',a.className],['Class Days',a.classDays],['Teacher',a.teacherName],['Class Timing',a.classTiming],['Zoom Link',a.zoomJoinLink]];openModal('Admission Details',`<div class="detail-grid">${pairs.map(p=>`<div class="detail"><small>${p[0]}</small><b>${esc(p[1]||'—')}</b></div>`).join('')}</div>${a.receiptImageUrl?`<h4>Payment Receipt</h4><a href="${esc(a.receiptImageUrl)}" target="_blank" rel="noopener"><img class="receipt" src="${esc(a.receiptImageUrl)}" alt="Payment receipt"></a>`:''}${a.studentPhotoUrl?`<h4>Student Photo</h4><img class="receipt" style="max-width:180px" src="${esc(a.studentPhotoUrl)}">`:''}`,[{label:'Close',cls:'btn-primary',run:closeModal}])}
function editAdmission(id){let a=findAdmission(id);if(!a)return;let fields=[['studentName','Student Name',a.studentName],['parentName','Parent / Guardian',a.parentName],['age','Age',a.age],['gender','Gender',a.gender],['country','Country',a.country],['whatsapp','WhatsApp',a.whatsapp],['email','Email',a.email],['course','Course',a.course],['experience','Previous Experience',a.experience],['preferredTiming','Preferred Timing',a.preferredTiming],['classTiming','Class Timing',a.classTiming],['rollNo','Roll Number',a.rollNo],['studentStatus','Student Status',a.studentStatus],['studentPhotoUrl','Student Photo URL',a.studentPhotoUrl]];openModal('Edit Admission',`<form id="editAdmissionForm" class="form-grid">${fields.map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" value="${esc(f[2]||'')}"></div>`).join('')}</form>`,[{label:'Cancel',run:closeModal},{label:'Save changes',cls:'btn-primary',run:async()=>{let d=Object.fromEntries(new FormData($('#editAdmissionForm')).entries());d.applicationId=id;try{await api('erpUpdateAdmission',withToken(d));await refreshCurrent();closeModal();notify('Admission updated successfully.')}catch(e){notify(e.message,true)}}}])}
function editPayment(id){let a=findAdmission(id);if(!a)return;openModal('Record Payment',`<p class="muted">Enter the amount due and the total amount received so far. Set received amount to zero to reset this admission to Pending.</p><form id="paymentForm"><div class="form-grid"><div class="field"><label>Amount Due</label><input name="amountDue" type="number" min="0" step="0.01" value="${Number(a.amountDue||0)}" required></div><div class="field"><label>Amount Paid / Received</label><input name="amountPaid" type="number" min="0" step="0.01" value="${Number(a.amountPaid||0)}" required></div><div class="field"><label>Currency</label><select name="currency"><option ${a.paymentCurrency==='PKR'?'selected':''}>PKR</option><option ${a.paymentCurrency==='USD'?'selected':''}>USD</option></select></div></div></form>`,[{label:'Cancel',run:closeModal},{label:'Save payment',cls:'btn-primary',run:async()=>{let d=Object.fromEntries(new FormData($('#paymentForm')).entries());d.applicationId=id;d.amountDue=Number(d.amountDue);d.amountPaid=Number(d.amountPaid);try{let r=await api('erpUpdatePayment',withToken(d));await refreshCurrent();closeModal();notify(r.message)}catch(e){notify(e.message,true)}}}])}
async function verifyPayment(id){try{await api('erpVerifyPayment',withToken({applicationId:id}));await refreshCurrent();notify('Payment verified. Student portal credentials have been generated.')}catch(e){notify(e.message,true)}}
function editClass(id){let a=findAdmission(id);if(!a)return;let fields=[['rollNo','Roll Number',a.rollNo||a.portalUsername],['className','Class Name',a.className||a.course],['classDays','Class Days',a.classDays],['teacherName','Teacher Name',a.teacherName],['classTiming','Class Timing',a.classTiming],['zoomJoinLink','Zoom Join Link',a.zoomJoinLink]];openModal('Class & Portal Details',`<form id="classForm" class="form-grid">${fields.map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" value="${esc(f[2]||'')}"></div>`).join('')}</form>`,[{label:'Cancel',run:closeModal},{label:'Save class details',cls:'btn-primary',run:async()=>{let d=Object.fromEntries(new FormData($('#classForm')).entries());d.applicationId=id;try{await api('erpUpdateClass',withToken(d));await refreshCurrent();closeModal();notify('Class and portal details updated.')}catch(e){notify(e.message,true)}}}])}
async function refreshCurrent(){await loadAdmissions();renderAdmissionsPage(state.page)}
function renderResults(){let rows=state.results;let q=state.query.toLowerCase();let filtered=rows.filter(r=>!q||r.values.join(' ').toLowerCase().includes(q));let p=paged(filtered.map(r=>({...r,studentName:String(r.values[1]||r.values[0]||'')})));let visible=p.items;$('#pageContent').innerHTML=`<div class="page-head"><div><h1>Results Management</h1><p>Create, edit and publish student results. Only published records appear publicly.</p></div><button class="btn btn-primary" onclick="editResult(0)">＋ Add Result</button></div>${toolbar(false)}<div class="panel"><div class="table-wrap"><table><thead><tr>${state.resultHeaders.map(h=>`<th>${esc(h)}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${visible.map(r=>`<tr>${r.values.map((v,i)=>`<td>${i===9?statusPill(String(v)==='TRUE'?'Published':'Draft'):esc(v)}</td>`).join('')}<td><div class="table-actions"><button class="btn btn-soft" onclick="editResult(${r.rowNumber})">Edit</button><button class="btn btn-primary" onclick="togglePublish(${r.rowNumber},${String(r.values[state.resultHeaders.findIndex(h=>h.toLowerCase()==='published')]).toUpperCase()!=='TRUE'})">${String(r.values[state.resultHeaders.findIndex(h=>h.toLowerCase()==='published')]).toUpperCase()==='TRUE'?'Unpublish':'Publish'}</button><button class="btn btn-danger" onclick="deleteResult(${r.rowNumber})">Delete</button></div></td></tr>`).join('')||`<tr><td colspan="${state.resultHeaders.length+1}" class="empty">No results found.</td></tr>`}</tbody></table></div>${pager(p)}</div>`;attachToolbar(renderResults);bindPager(p,renderResults)}
function editResult(row){let r=state.results.find(x=>x.rowNumber===row);let vals=r?r.values:state.resultHeaders.map(()=>''),fields=state.resultHeaders.map((h,i)=>{let isPub=/published/i.test(h);return `<div class="field"><label>${esc(h)}</label>${isPub?`<select name="v${i}"><option value="FALSE" ${String(vals[i]).toUpperCase()!=='TRUE'?'selected':''}>Draft / Hidden</option><option value="TRUE" ${String(vals[i]).toUpperCase()==='TRUE'?'selected':''}>Published</option></select>`:`<input name="v${i}" value="${esc(vals[i]??'')}">`}</div>`}).join('');openModal(row?'Edit Result':'Add Result',`<form id="resultForm" class="form-grid">${fields}</form>`,[{label:'Cancel',run:closeModal},{label:'Save result',cls:'btn-primary',run:async()=>{let fd=new FormData($('#resultForm'));let values=state.resultHeaders.map((_,i)=>fd.get('v'+i)||'');try{await api('erpSaveResult',withToken({rowNumber:row,values}));await loadResults();closeModal();renderResults();notify('Result saved.')}catch(e){notify(e.message,true)}}}])}
async function togglePublish(row,published){try{await api('erpPublishResult',withToken({rowNumber:row,published}));await loadResults();renderResults();notify(published?'Result published.':'Result unpublished.')}catch(e){notify(e.message,true)}}
async function deleteResult(row){if(!confirm('Delete this result row permanently?'))return;try{await api('erpDeleteResult',withToken({rowNumber:row}));await loadResults();renderResults();notify('Result deleted.')}catch(e){notify(e.message,true)}}
function renderUsers(){let q=state.query.toLowerCase(),rows=state.users.filter(u=>!q||[u.fullName,u.email,u.userId].some(v=>String(v||'').toLowerCase().includes(q)));let p=paged(rows.map(u=>({...u,studentName:u.fullName})));$('#pageContent').innerHTML=`<div class="page-head"><div><h1>Portal Users</h1><p>Manage registered student accounts. Passwords are never displayed.</p></div><button class="btn btn-line" onclick="loadUsers().then(renderUsers)">↻ Refresh</button></div>${toolbar(false)}<div class="panel"><div class="table-wrap"><table><thead><tr><th>User</th><th>Email</th><th>Provider</th><th>Created</th><th>Status</th><th>Action</th></tr></thead><tbody>${p.items.map(u=>`<tr><td><b>${esc(u.fullName)}</b><div class="subline">${esc(u.userId)}</div></td><td>${esc(u.email)}</td><td>${esc(u.authProvider)}</td><td>${esc(u.createdAt||'')}</td><td>${statusPill(u.status)}</td><td><button class="btn btn-soft" onclick="editUser(${u.rowNumber})">Edit</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No users found.</td></tr>'}</tbody></table></div>${pager(p)}</div>`;attachToolbar(renderUsers);bindPager(p,renderUsers)}
function editUser(row){let u=state.users.find(x=>x.rowNumber===row);if(!u)return;openModal('Edit Portal User',`<form id="userForm"><div class="field"><label>Full Name</label><input name="fullName" value="${esc(u.fullName)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(u.email)}"></div><div class="field"><label>Set New Password (optional)</label><input name="newPassword" type="password" minlength="8" placeholder="Leave blank to keep current password"></div></form>`,[{label:'Cancel',run:closeModal},{label:'Save user',cls:'btn-primary',run:async()=>{let d=Object.fromEntries(new FormData($('#userForm')).entries());d.rowNumber=row;try{await api('erpUpdateUser',withToken(d));await loadUsers();closeModal();renderUsers();notify('User updated.')}catch(e){notify(e.message,true)}}}])}
</script>
</body>
